basePath: /
definitions:
  handler.AdminRoomItem:
    properties:
      created_at:
        type: string
      id:
        type: integer
      member_count:
        type: integer
      name:
        type: string
      owner_email:
        type: string
      owner_id:
        type: integer
      owner_nickname:
        type: string
      talk_count:
        type: integer
    type: object
  handler.AdminStatsResponse:
    properties:
      gemini_calls_month:
        type: integer
      gemini_calls_today:
        type: integer
      gemini_calls_total:
        type: integer
      status_counts:
        additionalProperties:
          format: int64
          type: integer
        type: object
      total_talks:
        type: integer
      total_users:
        type: integer
    type: object
  handler.AdminUserItem:
    properties:
      avatar:
        type: string
      created_at:
        type: string
      email:
        type: string
      gemini_call_count:
        type: integer
      id:
        type: integer
      is_suspended:
        type: boolean
      language:
        type: string
      nickname:
        type: string
      role:
        type: string
      talk_count:
        type: integer
    type: object
  handler.AuthRequest:
    properties:
      avatar:
        description: Optional on signup
        example: "\U0001F464"
        type: string
      email:
        example: user@example.com
        type: string
      language:
        description: Optional on signup
        example: tr
        type: string
      nickname:
        description: Required on signup
        example: my_nickname
        type: string
      password:
        example: secret123
        minLength: 4
        type: string
    required:
    - email
    - password
    type: object
  handler.AuthResponse:
    properties:
      avatar:
        example: "\U0001F464"
        type: string
      created_at:
        type: string
      email:
        example: user@example.com
        type: string
      language:
        example: tr
        type: string
      nickname:
        example: my_nickname
        type: string
      role:
        example: user
        type: string
      token:
        example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        type: string
      user_id:
        example: 1
        type: integer
    type: object
  handler.CreateRoomBody:
    properties:
      name:
        example: Pazarlama Ekibi
        type: string
    required:
    - name
    type: object
  handler.CreateTalkRequestBody:
    properties:
      custom_speech_type:
        example: Özel Şirket İçi Sunum
        type: string
      duration:
        example: 5
        type: integer
      generated_text:
        type: string
      instruction:
        description: Required for update/partial_update
        example: make the staff member more helpful
        type: string
      language:
        example: German
        type: string
      mode:
        description: '"new", "update", "partial_update", or "manual_update"'
        example: new
        type: string
      parent_id:
        description: Required for update/partial_update
        example: 1
        type: integer
      place:
        example: Airport Check-in
        type: string
      room_id:
        description: 'Optional: attach a "new" talk to a shared room (requires writer
          membership)'
        example: 1
        type: integer
      selected_text:
        description: Required only for partial_update mode
        example: Ladies and gentlemen...
        type: string
      speech_type:
        example: politician
        type: string
      topic:
        example: Checking in baggage and asking for a window seat
        type: string
    required:
    - mode
    type: object
  handler.ErrorResponse:
    properties:
      error:
        example: invalid request parameters
        type: string
    type: object
  handler.GoogleAuthRequest:
    properties:
      google_token:
        example: google_oauth_token_here
        type: string
    required:
    - google_token
    type: object
  handler.InviteMemberBody:
    properties:
      email:
        example: teammate@example.com
        type: string
      role:
        description: '"writer" or "reader"'
        example: writer
        type: string
    required:
    - email
    - role
    type: object
  handler.InviteResponse:
    properties:
      created_at:
        type: string
      id:
        type: integer
      invited_by:
        type: string
      role:
        type: string
      room_id:
        type: integer
      room_name:
        type: string
      status:
        type: string
    type: object
  handler.PatchTalkMetaBody:
    properties:
      is_archived:
        description: nil = no change
        type: boolean
      is_favorite:
        description: nil = no change
        type: boolean
      tags:
        description: nil = no change; empty slice = clear all tags
        items:
          type: string
        type: array
    type: object
  handler.PostMessageBody:
    properties:
      text:
        example: Girişi biraz daha resmi yapalım mı?
        type: string
    required:
    - text
    type: object
  handler.RoomMemberResponse:
    properties:
      email:
        type: string
      nickname:
        type: string
      role:
        type: string
      status:
        type: string
      user_id:
        type: integer
    type: object
  handler.RoomMessageResponse:
    properties:
      avatar:
        type: string
      created_at:
        type: string
      id:
        type: integer
      nickname:
        type: string
      room_id:
        type: integer
      talk_request_id:
        type: integer
      text:
        type: string
      user_id:
        type: integer
    type: object
  handler.RoomResponse:
    properties:
      created_at:
        type: string
      has_unread:
        type: boolean
      id:
        type: integer
      member_count:
        type: integer
      members:
        items:
          $ref: '#/definitions/handler.RoomMemberResponse'
        type: array
      name:
        type: string
      owner_id:
        type: integer
      role:
        type: string
      talk_count:
        type: integer
      talk_unread_counts:
        additionalProperties:
          format: int64
          type: integer
        type: object
      unread_count:
        type: integer
    type: object
  handler.TalkRequestResponse:
    properties:
      children:
        items:
          $ref: '#/definitions/handler.TalkRequestResponse'
        type: array
      created_at:
        type: string
      custom_speech_type:
        type: string
      duration:
        type: integer
      error_message:
        type: string
      generated_text:
        type: string
      has_unread:
        type: boolean
      id:
        type: integer
      instruction:
        type: string
      is_archived:
        type: boolean
      is_favorite:
        type: boolean
      language:
        type: string
      mode:
        type: string
      parent_id:
        type: integer
      place:
        type: string
      room_id:
        type: integer
      selected_text:
        type: string
      speech_type:
        type: string
      status:
        type: string
      tags:
        items:
          type: string
        type: array
      topic:
        type: string
      unread_count:
        type: integer
      updated_at:
        type: string
      user_id:
        type: integer
      version_label:
        type: string
      version_number:
        type: integer
    type: object
  handler.TalkTypeResponse:
    properties:
      id:
        type: integer
      is_custom:
        type: boolean
      key:
        type: string
      symbol:
        type: string
      title:
        type: string
    type: object
  handler.TranslateBody:
    properties:
      language:
        example: İngilizce
        type: string
    required:
    - language
    type: object
  handler.TranslateResponse:
    properties:
      language:
        type: string
      text:
        type: string
    type: object
  handler.UpdateLanguageRequest:
    properties:
      language:
        example: tr
        type: string
    required:
    - language
    type: object
  handler.UpdateUserRequest:
    properties:
      is_suspended:
        example: true
        type: boolean
      role:
        example: admin
        type: string
    type: object
  model.Room:
    properties:
      created_at:
        type: string
      id:
        type: integer
      name:
        type: string
      owner_id:
        type: integer
      updated_at:
        type: string
    type: object
  model.RoomMember:
    properties:
      created_at:
        type: string
      id:
        type: integer
      invited_email:
        type: string
      last_read_at:
        type: string
      role:
        enum:
        - writer
        - reader
        type: string
      room_id:
        type: integer
      status:
        enum:
        - pending
        - accepted
        - declined
        type: string
      user_id:
        type: integer
    type: object
  model.RoomMessage:
    properties:
      created_at:
        type: string
      id:
        type: integer
      room_id:
        type: integer
      talk_request_id:
        type: integer
      text:
        type: string
      user_id:
        type: integer
    type: object
  model.TalkRequest:
    properties:
      created_at:
        type: string
      custom_speech_type:
        type: string
      duration:
        type: integer
      error_message:
        type: string
      generated_text:
        type: string
      id:
        type: integer
      instruction:
        type: string
      is_archived:
        type: boolean
      is_favorite:
        type: boolean
      language:
        type: string
      mode:
        enum:
        - new
        - update
        - partial_update
        type: string
      parent_id:
        type: integer
      place:
        type: string
      room_id:
        description: nil = personal talk; set = shared inside a Room
        type: integer
      selected_text:
        type: string
      speech_type:
        type: string
      status:
        enum:
        - pending
        - processing
        - completed
        - failed
        type: string
      topic:
        type: string
      updated_at:
        type: string
      user_id:
        type: integer
      version_label:
        type: string
      version_number:
        type: integer
    type: object
info:
  contact:
    email: support@talkforge.local
    name: TalkForge Support
  description: Production-ready authentication and role verification API for TalkForge.
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  termsOfService: http://swagger.io/terms/
  title: TalkForge API
  version: "1.0"
paths:
  /api/v1/admin/rooms:
    get:
      description: Returns list of all rooms with owner info, active member counts
        and total room talks.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/handler.AdminRoomItem'
            type: array
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List Rooms (Admin)
      tags:
      - Admin
  /api/v1/admin/stats:
    get:
      description: Returns metrics such as user counts, talk status breakdown, and
        daily/monthly Gemini API calls.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.AdminStatsResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Platform Statistics (Admin)
      tags:
      - Admin
  /api/v1/admin/users:
    get:
      description: Returns list of all users with their role, suspension status, total
        talk requests and Gemini calls.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/handler.AdminUserItem'
            type: array
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List Users (Admin)
      tags:
      - Admin
  /api/v1/admin/users/{id}:
    patch:
      consumes:
      - application/json
      description: Allows admins to update a user's role ("user" or "admin") or suspend/unsuspend
        their account.
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        type: integer
      - description: Update User Payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.UpdateUserRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.AdminUserItem'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Update User (Admin)
      tags:
      - Admin
  /api/v1/auth/google:
    post:
      consumes:
      - application/json
      description: Authenticates user via Google OAuth (validates token with Google
        API if Client ID is configured).
      parameters:
      - description: Google Auth Payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.GoogleAuthRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.AuthResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      summary: Google Sign-In
      tags:
      - Auth
  /api/v1/auth/login:
    post:
      consumes:
      - application/json
      description: Logs in with email/password and returns a JWT token.
      parameters:
      - description: Login Payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.AuthRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.AuthResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      summary: Login user
      tags:
      - Auth
  /api/v1/auth/signup:
    post:
      consumes:
      - application/json
      description: Creates a new account with email/password.
      parameters:
      - description: Register Payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.AuthRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/handler.AuthResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      summary: Register a new user
      tags:
      - Auth
  /api/v1/hello/admin:
    get:
      description: Returns a greeting for authenticated administrators only.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Admin Hello
      tags:
      - Hello
  /api/v1/hello/public:
    get:
      description: Returns a public greeting without requiring authentication.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Public Hello
      tags:
      - Hello
  /api/v1/hello/user:
    get:
      description: Returns a greeting for authenticated users.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      security:
      - BearerAuth: []
      summary: User Hello
      tags:
      - Hello
  /api/v1/invites:
    get:
      description: Returns all pending room invitations addressed to the authenticated
        user.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/handler.InviteResponse'
            type: array
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List my pending invitations
      tags:
      - Invites
  /api/v1/invites/{id}/accept:
    post:
      description: Sets the invitation status to "accepted", granting the user access
        to the room.
      parameters:
      - description: Invite (RoomMember) ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.InviteResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Accept a room invitation
      tags:
      - Invites
  /api/v1/invites/{id}/decline:
    post:
      description: Sets the invitation status to "declined". The user will not be
        added to the room.
      parameters:
      - description: Invite (RoomMember) ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.InviteResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Decline a room invitation
      tags:
      - Invites
  /api/v1/rooms:
    get:
      description: Returns every room the authenticated user is an accepted member
        of.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/handler.RoomResponse'
            type: array
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List my rooms
      tags:
      - Rooms
    post:
      consumes:
      - application/json
      description: Creates a room that talks can be shared inside; the creator becomes
        its first writer member.
      parameters:
      - description: Create Room Payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.CreateRoomBody'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/model.Room'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Create a shared room
      tags:
      - Rooms
  /api/v1/rooms/{id}:
    get:
      description: Returns a room's details and accepted member list. Requires accepted
        membership.
      parameters:
      - description: Room ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.RoomResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get room details
      tags:
      - Rooms
  /api/v1/rooms/{id}/leave:
    post:
      description: Removes the requester from a room. Transfers ownership or deletes
        room if owner leaves.
      parameters:
      - description: Room ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Leave a room
      tags:
      - Rooms
  /api/v1/rooms/{id}/members:
    post:
      consumes:
      - application/json
      description: Creates a pending invitation for a user by email. Requires the
        requester to be an accepted writer member.
      parameters:
      - description: Room ID
        in: path
        name: id
        required: true
        type: integer
      - description: Invite Payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.InviteMemberBody'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/model.RoomMember'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Invite a member into a room
      tags:
      - Rooms
  /api/v1/talk-types:
    get:
      description: Returns multi-language talk types localized based on Accept-Language
        header or lang query parameter.
      parameters:
      - description: Language header e.g. tr, en, de
        in: header
        name: Accept-Language
        type: string
      - description: Language override query param e.g. tr, en, de
        in: query
        name: lang
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/handler.TalkTypeResponse'
            type: array
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      summary: List dynamic talk types / purposes
      tags:
      - Lookup
  /api/v1/talks:
    get:
      description: Returns the dialogue generation requests for the authenticated
        user, nested in a parent-child tree structure representing branches created
        by updates. Supports filtering by favorite, archived, and tag. Supports limit/offset
        pagination on root conversations.
      parameters:
      - description: Filter by favorite status (true = only favorites)
        in: query
        name: favorite
        type: boolean
      - description: Filter archived talks (true = only archived; omit or false =
          hide archived)
        in: query
        name: archived
        type: boolean
      - description: Filter talks containing this tag (exact match)
        in: query
        name: tag
        type: string
      - description: Max root conversations to return (default 50, max 200)
        in: query
        name: limit
        type: integer
      - description: Number of root conversations to skip (default 0)
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/handler.TalkRequestResponse'
            type: array
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List dialogue requests as a tree
      tags:
      - Talks
    post:
      consumes:
      - application/json
      description: Creates a pending request to generate dialogue text via Gemini.
        Mode can be "new" or "update".
      parameters:
      - description: Create Request Payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.CreateTalkRequestBody'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/model.TalkRequest'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Create dialogue generation request
      tags:
      - Talks
  /api/v1/talks/{id}:
    delete:
      description: Deletes a dialogue generation request and any nested descendant
        updates.
      parameters:
      - description: Talk Request ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Delete dialogue request
      tags:
      - Talks
  /api/v1/talks/{id}/messages:
    get:
      description: Returns the discussion thread for a room-shared talk. Requires
        room membership.
      parameters:
      - description: Talk Request ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/handler.RoomMessageResponse'
            type: array
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List a talk's discussion messages
      tags:
      - Discussion
    post:
      consumes:
      - application/json
      description: Adds a message to a room-shared talk's discussion thread. Requires
        room membership.
      parameters:
      - description: Talk Request ID
        in: path
        name: id
        required: true
        type: integer
      - description: Message Payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.PostMessageBody'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/model.RoomMessage'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Post a discussion message
      tags:
      - Discussion
  /api/v1/talks/{id}/messages/summarize:
    post:
      description: Summarizes the talk's discussion thread and queues a new version
        using the summary as the update instruction. Requires writer room membership.
      parameters:
      - description: Talk Request ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/model.TalkRequest'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Summarize discussion into a new version
      tags:
      - Discussion
  /api/v1/talks/{id}/meta:
    patch:
      consumes:
      - application/json
      description: Sets is_favorite, is_archived, and/or tags on a root TalkRequest.
        Only root conversations (parent_id IS NULL) are accepted. Tags replace the
        full tag list for the requesting user.
      parameters:
      - description: Root Talk Request ID
        in: path
        name: id
        required: true
        type: integer
      - description: Metadata patch payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.PatchTalkMetaBody'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.TalkRequestResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Update talk metadata (favorite / archived / tags)
      tags:
      - Talks
  /api/v1/talks/{id}/translate:
    post:
      consumes:
      - application/json
      description: Returns the talk's text translated into the given language. Not
        persisted — no new version is created. Requires read access to the talk.
      parameters:
      - description: Talk Request ID
        in: path
        name: id
        required: true
        type: integer
      - description: Target Language
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.TranslateBody'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.TranslateResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Preview a talk translated into another language
      tags:
      - Talks
  /api/v1/user/language:
    put:
      consumes:
      - application/json
      description: Updates the preferred language of the authenticated user.
      parameters:
      - description: Language Update Payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.UpdateLanguageRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Update User Language
      tags:
      - User
securityDefinitions:
  BearerAuth:
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
